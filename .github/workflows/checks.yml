# Fast checks for every pull request: the same ones a contributor runs
# locally. No OS images are built here.
name: checks

on:
  pull_request:
  push:
    branches: [main, zimaos-style]

permissions:
  contents: read

jobs:
  go:
    name: go
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: "[CORE]"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: "[CORE]/go.mod"
          cache-dependency-path: "[CORE]/go.mod"
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then echo "Run gofmt -w on:"; echo "$unformatted"; exit 1; fi
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./...

  dashboard:
    name: dashboard
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JavaScript syntax
        run: for f in "[DASHBOARD]"/*.js; do node --check "$f"; done
      # Local fixtures with fake services. Browser fixtures use preinstalled
      # Chromium and fake APIs; no running jenerd or browser downloads needed.
      - name: Fixtures
        run: |
          for f in \
            .scratch/setup/check-pages.cjs \
            .scratch/setup/check-controls.cjs \
            .scratch/setup/check-welcome.cjs \
            .scratch/setup/check-click-shim.cjs \
            .scratch/setup/check-shine.cjs \
            .scratch/setup/check-kiosk-shine.cjs \
            .scratch/phone-polish/check-phone-polish.cjs \
            .scratch/setup/check-phone.cjs \
            .scratch/setup/check-qr.cjs \
            .scratch/setup/check-rollback.cjs \
            .scratch/setup/check-screen.cjs \
            .scratch/setup/check-kiosk-fallback.cjs \
            .scratch/setup/check-unit-ordering.cjs \
            .scratch/setup/check-validation.cjs \
            .scratch/setup/check-icons-public.cjs \
            .scratch/zimaos/check-desktop.cjs \
            .scratch/zimaos/check-storage.cjs \
            .scratch/zimaos/check-login.cjs \
            .scratch/zimaos/check-onboarding.cjs \
            .scratch/zimaos/check-ssh-helper.cjs
          do
            echo "::group::$f"
            node "$f"
            echo "::endgroup::"
          done
      - name: Welcome rendered visibility (Chromium)
        run: node .scratch/setup/check-welcome-browser.cjs
