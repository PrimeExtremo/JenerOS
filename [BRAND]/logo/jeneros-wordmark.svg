<svg xmlns="http://www.w3.org/2000/svg" width="1472" height="320" viewBox="0 0 1472 320" role="img" aria-labelledby="title desc">
  <title id="title">JenerOS wordmark</title>
  <desc id="desc">The J monogram beside JENEROS in wide, geometric capitals drawn entirely as paths.</desc>
