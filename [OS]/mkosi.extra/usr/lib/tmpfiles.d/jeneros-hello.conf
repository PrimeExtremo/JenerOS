# /etc survives A/B updates. Refresh these links at every boot from /usr.
d /etc/profile.d 0755 root root -
L+ /etc/profile.d/jeneros-hello.sh - - - - /usr/lib/jeneros/hello-profile.sh
L+ /etc/motd - - - - /usr/lib/jeneros/empty-motd
# PAM runs Debian's dynamic MOTD too; replace its executable uname script
# with the empty /usr file on existing roots as well as fresh installations.
d /etc/update-motd.d 0755 root root -
L+ /etc/update-motd.d/10-uname - - - - /usr/lib/jeneros/empty-motd
