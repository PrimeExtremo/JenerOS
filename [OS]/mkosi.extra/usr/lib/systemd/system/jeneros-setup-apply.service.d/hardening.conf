[Service]
NoNewPrivileges=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
RestrictNamespaces=yes
SystemCallFilter=@system-service
SystemCallErrorNumber=EPERM
MemoryDenyWriteExecute=yes
RestrictSUIDSGID=yes
LockPersonality=yes
LimitCORE=0
ProtectSystem=strict
# useradd creates the owner's home; setupcon/loadkeys need the console devices.
ProtectHome=no
PrivateTmp=yes
PrivateDevices=no
ReadWritePaths=/etc /home /var /run/jeneros /run/jeneros-setup
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK
CapabilityBoundingSet=CAP_CHOWN CAP_DAC_OVERRIDE CAP_FOWNER CAP_SETUID CAP_SETGID CAP_AUDIT_WRITE CAP_SYS_TTY_CONFIG
RestrictSUIDSGID=no
