[Unit]
# Releases start with SSH off. The owner can opt in locally; dev/test keys keep
# the existing build-VM access. Persistent opt-in survives A/B updates.
ConditionPathExists=|/var/lib/jeneros/ssh-enabled
ConditionPathExists=|/usr/share/jeneros/dev/authorized_keys

[Service]
ExecStartPre=
ExecStartPre=/usr/sbin/sshd -t -f /usr/lib/jeneros/sshd_config
ExecStart=
ExecStart=/usr/sbin/sshd -D -f /usr/lib/jeneros/sshd_config $SSHD_OPTS
ExecReload=
ExecReload=/usr/sbin/sshd -t -f /usr/lib/jeneros/sshd_config
ExecReload=/bin/kill -HUP $MAINPID
