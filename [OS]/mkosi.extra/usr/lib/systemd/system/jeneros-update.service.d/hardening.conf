[Service]
NoNewPrivileges=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
RestrictNamespaces=yes
SystemCallFilter=@system-service
SystemCallErrorNumber=EPERM
MemoryDenyWriteExecute=yes
RestrictSUIDSGID=yes
LockPersonality=yes
LimitCORE=0
ProtectSystem=strict
ProtectHome=yes
PrivateTmp=yes
PrivateDevices=no
RuntimeDirectory=jeneros-update
RuntimeDirectoryPreserve=yes
ReadWritePaths=/run/jeneros /run/jeneros-update /boot -/efi -/sys/firmware/efi/efivars /var/tmp
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK
CapabilityBoundingSet=CAP_DAC_OVERRIDE CAP_DAC_READ_SEARCH CAP_SYS_ADMIN CAP_LINUX_IMMUTABLE
# sysupdate may mount the ESP and update partition metadata.
SystemCallFilter=@mount
