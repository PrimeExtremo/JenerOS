# JenerOS base image. Build with ./os/build.sh (inside WSL / Linux).
# Phase 1, milestone 1: boots in a VM, starts jenerd, serves the dashboard on :80.

[Distribution]
Distribution=debian
Release=trixie
Architecture=x86-64
Repositories=main,contrib,non-free-firmware

[Output]
Format=disk
ImageId=jeneros
ImageVersion=0.1.0
OutputDirectory=out

[Build]
ToolsTree=default

[Content]
Bootable=yes
Bootloader=systemd-boot
Hostname=jeneros
KernelCommandLine=console=tty0 quiet
# Dev builds only: log in on the VM console without a password.
Autologin=yes
# Built by build.sh: jenerd binary, dashboard and store catalog.
ExtraTrees=build/staging:/
Packages=
        linux-image-amd64
        systemd
        systemd-boot
        systemd-resolved
        systemd-timesyncd
        udev
        dbus
        openssh-server
        ca-certificates
        iproute2
        curl
        less
        nano
        sudo
        firmware-linux-free
