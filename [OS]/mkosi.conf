# JenerOS base image. Build with ./[OS]/build.sh inside the build VM.
# Milestone 2 layout (see mkosi.repart/): read-only /usr in A/B slots checked by
# dm-verity, writable root that grows on first boot, one UKI per version on the ESP.

[Distribution]
Distribution=debian
Release=trixie
Architecture=x86-64
Repositories=main,contrib,non-free-firmware

[Output]
Format=disk
ImageId=jeneros
# build.sh passes --image-version; this is only the fallback.
ImageVersion=0.2.0
OutputDirectory=out
# Separate files for the update server: usr + verity partitions and the UKI.
SplitArtifacts=uki,partitions

[Build]
ToolsTree=default

[Content]
Bootable=yes
Bootloader=systemd-boot
UnifiedKernelImages=yes
UnifiedKernelImageFormat=%i_%v
Hostname=jeneros
KernelCommandLine=console=tty0 quiet splash rw
# Dev builds only: log in on the VM console without a password.
Autologin=yes
# Built by build.sh: jenerd, dashboard, store catalog, os-release, sysupdate.d.
ExtraTrees=build/staging:/
Packages=
        linux-image-amd64
        systemd
        systemd-boot
        systemd-boot-efi
        systemd-repart
        systemd-container
        systemd-resolved
        systemd-timesyncd
        udev
        dbus
        openssh-server
        ca-certificates
        iproute2
        curl
        less
        nano
        sudo
        plymouth
        plymouth-themes
        firmware-linux-free
