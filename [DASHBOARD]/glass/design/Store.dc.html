<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>JenerOS App Store</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;overflow:hidden}
.noscroll::-webkit-scrollbar{display:none}
@keyframes sa-in{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
@keyframes sa-card{from{opacity:0;transform:perspective(900px) translateZ(-220px) rotateX(35deg);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
.sa-win{animation:sa-in .32s cubic-bezier(.2,.8,.2,1) both}
.sa-card{animation:sa-card .8s cubic-bezier(.16,1,.3,1) both;transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.sa-card:hover{transform:translateY(-2px)}
.sa-btn{font:inherit;color:inherit;cursor:pointer;border:none;transition:transform .3s cubic-bezier(.3,1.6,.5,1),background .2s}
.sa-btn:active{transform:scale(.95);transition:transform .06s}
.sa-reflect{-webkit-box-reflect:below 3px linear-gradient(transparent 65%,rgba(255,255,255,.18))}
@keyframes sa-float{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-10px) rotate(2deg)}}
.sa-float{animation:sa-float 6s ease-in-out infinite}
.sa-card:hover img{transform:scale(1.08) translateY(-2px)}.sa-card img{transition:transform .35s cubic-bezier(.3,1.5,.5,1)}
.sa-in{font:inherit;font-size:15px;color:inherit;border:none;outline:none;background:transparent;flex:1;min-width:0}
</style>
</helmet>
<div style="{{stageStyle}}">
<div class="sa-win" style="{{winStyle}}">
  <header style="display: flex; align-items: center; gap: 16px; padding: 24px 32px 12px">
    <h2 style="margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -0.03em; flex: 1">App Store</h2>
    <label style="{{searchStyle}}">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden">Search apps</span>
      <input class="sa-in" type="search" placeholder="Search apps" value="{{query}}" onInput="{{setQuery}}">
    </label>
    <button class="sa-btn" aria-label="Close App Store" onClick="{{close}}" style="{{iconBtn}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
  </header>
  <div role="tablist" aria-label="Categories" class="noscroll" style="display: flex; gap: 6px; padding: 0 32px 16px; overflow-x: auto; scrollbar-width: none; flex: none">
    <sc-for list="{{cats}}" as="c" hint-placeholder-count="8">
      <button class="sa-btn" role="tab" aria-selected="{{c.on}}" onClick="{{c.pick}}" style="{{c.style}}">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{c.icon}}"></path></svg>
        <span>{{c.label}}</span>
      </button>
    </sc-for>
  </div>
  <div class="noscroll" style="flex: 1; overflow-y: auto; scrollbar-width: none; padding: 0 32px 32px">

              <span style="font-size: 30px; font-weight: 800; line-height: 1.1; letter-spacing: -0.02em">{{h.title}}</span>
              <button class="sa-btn" onClick="{{h.act}}" style="{{h.btn}}">{{h.label}}</button>
            </div>
          </div>
        </sc-for>
      </div>
      <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 26px">
        <div style="display: flex; gap: 6px">
          <sc-for list="{{dots}}" as="o" hint-placeholder-count="3">
            <button class="sa-btn" aria-label="{{o.label}}" onClick="{{o.go}}" style="{{o.style}}"></button>
          </sc-for>
        </div>
        <div style="display: flex; gap: 8px">
          <button class="sa-btn" aria-label="Previous" onClick="{{prev}}" style="{{iconBtn}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button>
          <button class="sa-btn" aria-label="Next" onClick="{{next}}" style="{{iconBtn}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>
        </div>
      </div>
      <span style="font-size: 11px; font-weight: 800; letter-spacing: .08em; opacity: .55">FEATURED</span>
      <h3 style="margin: 2px 0 14px; font-size: 18px; font-weight: 800">Loved on JenerOS</h3>
      <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 12px; margin-bottom: 28px">
        <sc-for list="{{popular}}" as="a" hint-placeholder-count="7">
          <button class="sa-btn sa-card" onClick="{{a.act}}" aria-label="{{a.aria}}" style="{{popCard}}">
            <img src="{{a.img}}" alt="" class="sa-reflect" style="width: 52px; height: 52px; object-fit: contain">
            <span style="font-size: 13px; font-weight: 800; margin-top: 10px">{{a.name}}</span>
            <span style="font-size: 11px; opacity: .6">{{a.cat}}</span>
          </button>
        </sc-for>
      </div>
      <div style="{{panel}}">
        <span style="font-size: 11px; font-weight: 800; letter-spacing: .08em; opacity: .55">MOST INSTALLED</span>
        <h3 style="margin: 2px 0 10px; font-size: 18px; font-weight: 800">Everyone's favourites</h3>
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px 22px">
          <sc-for list="{{most}}" as="a" hint-placeholder-count="9">
          <div style="display: flex; align-items: center; gap: 12px; min-height: 64px">
            <img src="{{a.img}}" alt="" class="sa-reflect" style="width: 44px; height: 44px; object-fit: contain; flex: none">
            <div style="display: flex; flex-direction: column; min-width: 0; flex: 1">
              <span style="font-size: 14px; font-weight: 800">{{a.name}}</span>
              <span style="font-size: 12px; opacity: .65; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{a.desc}}</span>
              <sc-if value="{{a.busy}}" hint-placeholder-val="{{false}}"><span style="{{track}} margin-top: 6px"><span style="{{a.bar}}"></span></span></sc-if>
            </div>
            <button class="sa-btn" onClick="{{a.act}}" aria-label="{{a.aria}}" disabled="{{a.busy}}" style="{{a.btn}}">{{a.label}}</button>
          </div>
          </sc-for>
        </div>
      </div>
    </sc-if>
    <div style="display: flex; align-items: center; justify-content: space-between; margin: 26px 0 8px">
      <h3 style="margin: 0; font-size: 18px; font-weight: 800">{{listTitle}}</h3>
      <span style="font-size: 12px; opacity: .6">A to Z</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px 22px">
      <sc-for list="{{apps}}" as="a" hint-placeholder-count="9">
          <div style="display: flex; align-items: center; gap: 12px; min-height: 64px">
            <img src="{{a.img}}" alt="" class="sa-reflect" style="width: 44px; height: 44px; object-fit: contain; flex: none">
            <div style="display: flex; flex-direction: column; min-width: 0; flex: 1">
              <span style="font-size: 14px; font-weight: 800">{{a.name}}</span>
              <span style="font-size: 12px; opacity: .65; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{a.desc}}</span>
              <sc-if value="{{a.busy}}" hint-placeholder-val="{{false}}"><span style="{{track}} margin-top: 6px"><span style="{{a.bar}}"></span></span></sc-if>
            </div>
            <button class="sa-btn" onClick="{{a.act}}" aria-label="{{a.aria}}" disabled="{{a.busy}}" style="{{a.btn}}">{{a.label}}</button>
          </div>
      </sc-for>
    </div>
    <sc-if value="{{empty}}" hint-placeholder-val="{{false}}">
      <p style="margin: 40px 0; text-align: center; font-size: 15px; opacity: .7">No apps match “{{query}}”.</p>
    </sc-if>
  </div>
</div>
</div>

      label: label === 'All' ? 'Discover' : label, icon: CI[label], on: this.state.cat === label ? 'true' : 'false', pick: () => this.setState({ cat: label }),
      style: 'flex: none; display: flex; align-items: center; gap: 7px; min-height: 36px; padding: 0 14px; border-radius: 18px; font-size: 13px; font-weight: 700; white-space: nowrap; ' +
        (this.state.cat === label ? 'background: ' + (light ? '#ffffff' : 'rgba(255,255,255,.2)') + '; box-shadow: inset 0 1px 0 rgba(255,255,255,.5), 0 2px 8px rgba(0,0,0,.2);' : 'background: ' + soft + ';')
    }));
    const q = this.state.query.trim().toLowerCase();
    const list = CATALOG.filter((a) => (this.state.cat === 'All' || a.cat === this.state.cat) && (!q || (a.name + ' ' + a.desc + ' ' + a.cat).toLowerCase().includes(q)));
    const pillBase = 'flex: none; min-height: 32px; padding: 0 14px; border-radius: 18px; font-size: 13px; font-weight: 800; ';
    const view = (a) => {
      const has = installed.includes(a.id);
      const job = this.state.jobs[a.id];
      const busy = job !== undefined;
      return { ...a, busy, idle: !busy,
        stage: busy ? STAGES[Math.min(3, Math.floor(job / 25))] + '…' : '',
        bar: 'display: block; height: 100%; border-radius: 3px; background: #d97757; transition: width .14s linear; width: ' + (job || 0) + '%;',
        label: busy ? 'Installing' : (has ? 'Open' : 'Install'), aria: (has ? 'Open ' : 'Install ') + a.name,
        act: () => (busy ? null : has ? (typeof this.props.onClose === 'function' && this.props.onClose()) : this.install(a.id)),
        btn: pillBase + (has ? 'background: ' + soft + ';' : 'background: #b9562f; color: #ffffff;')
      };
    };
    const apps = list.slice().sort((x, y) => x.name.localeCompare(y.name)).map(view);
    const pick = (ids) => ids.map((id) => CATALOG.find((a) => a.id === id)).filter(Boolean).map(view);
    const popular = pick(['home-assistant', 'immich', 'jellyfin', 'vaultwarden', 'adguard-home', 'frigate', 'nextcloud']);
    const HERO = [
      { id: 'home-assistant', title: 'Your whole home, on one screen', art: 'linear-gradient(120deg, #0b3c5d, #18bcf2 55%, #8fe3ff)' },
      { id: 'immich', title: 'Every photo, backed up privately', art: 'linear-gradient(120deg, #3a0d2e, #ed79b5 50%, #ffb400)' },
      { id: 'jellyfin', title: 'Your movies, on every screen', art: 'linear-gradient(120deg, #1d0f3a, #aa5cc3 50%, #00a4dc)' }
    ];
    const slides = HERO.map((h, i) => {
      const a = view(CATALOG.find((c) => c.id === h.id));
      const on = this.state.slide === i;
      return { ...a, title: h.title,
        style: 'position: absolute; inset: 0; color: #ffffff; background: ' + h.art + '; transition: opacity .8s ease, transform 1.2s cubic-bezier(.2,.8,.2,1); opacity: ' + (on ? 1 : 0) + '; transform: scale(' + (on ? 1 : 1.06) + '); pointer-events: ' + (on ? 'auto' : 'none') + ';',
        btn: 'align-self: flex-start; margin-top: 8px; min-height: 36px; padding: 0 18px; border-radius: 18px; font-size: 13px; font-weight: 800; color: #1f1913; background: rgba(255,255,255,.92);' };
    });
    const dots = HERO.map((h, i) => ({ label: 'Show slide ' + (i + 1), go: () => this.setState({ slide: i }),
      style: 'height: 6px; border-radius: 3px; padding: 0; transition: width .3s, background .3s; width: ' + (this.state.slide === i ? '24px' : '6px') + '; background: ' + (this.state.slide === i ? ink : (light ? 'rgba(31,25,19,.25)' : 'rgba(255,255,255,.3)')) + ';' }));
    const most = pick(['home-assistant', 'immich', 'nextcloud', 'jellyfin', 'pi-hole', 'vaultwarden', 'plex', 'paperless-ngx', 'uptime-kuma']);
    return {
      winStyle: 'box-sizing: border-box; display: flex; flex-direction: column; width: 1100px; height: 720px; border-radius: 30px; overflow: hidden; font-family: "Bricolage Grotesque", system-ui, sans-serif; color: ' + ink + '; background: ' + (light ? 'rgba(250,246,238,.62)' : 'rgba(30,23,17,.55)') + '; backdrop-filter: blur(26px) saturate(170%); -webkit-backdrop-filter: blur(26px) saturate(170%); border: 1px solid rgba(255,255,255,.18); box-shadow: inset 0 1px 0 rgba(255,255,255,.45), 0 40px 90px rgba(0,0,0,.45);',
      searchStyle: 'position: relative; width: 260px; display: flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 14px; border-radius: 20px; background: ' + soft + ';',
      iconBtn: 'width: 40px; height: 40px; flex: none; border-radius: 20px; display: flex; align-items: center; justify-content: center; background: ' + soft + ';',
      featureStyle: 'display: flex; align-items: center; gap: 20px; padding: 22px 24px; margin-bottom: 16px; border-radius: 24px; background: linear-gradient(120deg, rgba(24,188,242,.22), rgba(217,119,87,.18)); box-shadow: inset 0 1px 0 rgba(255,255,255,.25);',
      showFeature: this.state.cat === 'All' && !q,
      card: 'display: flex; flex-direction: column; gap: 12px; min-height: 172px; padding: 18px; border-radius: 22px; box-sizing: border-box; background: ' + (light ? 'rgba(255,255,255,.7)' : 'rgba(255,255,255,.06)') + '; box-shadow: inset 0 1px 0 rgba(255,255,255,' + (light ? '.9' : '.12') + ');',
      track: 'display: block; height: 6px; border-radius: 3px; overflow: hidden; background: ' + soft + ';',
      stageStyle: this.props.backdrop === false ? 'display: contents;' : 'overflow: hidden; width: 1100px; height: 720px; background: ' + (light ? '#f6f1e7 url(/_blob/6f5f5dbf18010018d7b7e9e71bc02e48)' : '#1f1913 url(/_blob/a660d335a6a1a88e203551e9f8742a06)') + ' center / cover;',
      pageTitle: this.state.cat === 'All' ? 'Discover' : this.state.cat,
      sideStyle: 'width: 236px; flex: none; display: flex; flex-direction: column; padding: 20px 12px; background: ' + (light ? 'rgba(31,25,19,.05)' : 'rgba(255,255,255,.05)') + ';',
      slides, dots, prev: () => this.setState({ slide: (this.state.slide + 2) % 3 }), next: () => this.setState({ slide: (this.state.slide + 1) % 3 }),
      popular, most, listTitle: this.state.cat === 'All' && !q ? 'All apps' : (q ? 'Results' : this.state.cat),
      popCard: 'display: flex; flex-direction: column; align-items: center; padding: 18px 8px 16px; border-radius: 20px; background: ' + soft + '; box-shadow: inset 0 1px 0 rgba(255,255,255,.14);',
      panel: 'padding: 20px 22px; border-radius: 24px; background: ' + soft + '; box-shadow: inset 0 1px 0 rgba(255,255,255,.12);',
      cats, apps, empty: apps.length === 0, query: this.state.query,
      setQuery: (e) => this.setState({ query: e.target.value }),
      close: () => { if (typeof this.props.onClose === 'function') this.props.onClose(); }
    };
  }
}
</script>
